[project]
name = "traceformer"
version = "0.1.0"
description = "Tracing GPT-2's internal geometry: interpretability infrastructure + a library of studies."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "huggingface-hub>=0.36.2",
    "matplotlib>=3.7.5",
    "safetensors>=0.5.3",
    "scipy>=1.10.1",
    "torch>=2.5.1",
    "transformers>=4.12.2",
]

[project.scripts]
traceformer = "traceformer:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "traceformer"
module-root = ""

[dependency-groups]
dev = [
    "spyder>=5.4.5",
    "traitlets<5.16",
]
